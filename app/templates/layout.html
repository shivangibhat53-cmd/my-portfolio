<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "utf-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0"
        
        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{{ url_for('static',filename = 'css/style.css') }}" rel = "stylesheet">
        {% block headd %} {% endblock %}
    </head>
    <body>
        <!-- Navbar-->
        <nav class ="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">
            <div class = "container">
                <a class = "navbar-brand fw-bold" href = "{{ url_for('main.home') }}">My Portfolio</a>
                <button class = "navbar-toggler" type = "button" data-bs-toggle = "collapse" data-bs-target = "#navbarNav">
                    <span class = "navbar-toggler-icon"></span>
                </button>
                <div class = "collapse navbar-collapse" id = "navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class = "nav-item">
                            <!--<a href = "{{ url_for('main.home') }}" class ="btn btn-outline-light me-2">Home</a> -->
                            <a class = "nav-link" href = "{{ url_for('main.home') }}">Home</a>
                        </li>
                        <li class = "nav-item">
                            <a class = "nav-link" href = "{{ url_for('projects.project_page') }}"> Projects </a>
                        </li>
                        {% if current_user.is_authenticated %}
                        <li class = "nav-item">
                            <a class = "nav-link" href = "{{ url_for('auth.logout') }}"> Logout </a>
                        </li>
                        {% else %}
                        <li class = "nav-item">
                            <a class = "nav-link" href = "{{ url_for('auth.login') }}">Admin Login</a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
                <div>
        </nav>
        <!-- Page content-->
         <div class = "container mt-4">
            {% block content %}{% endblock %}
         </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>


</html>
