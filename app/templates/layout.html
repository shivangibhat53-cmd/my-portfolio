<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "utf-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0"
        <title> {% block title %} My Portfolio {% endblock %}</title>

        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{{ url_for('static',filename = 'css/style.css') }}" rel = "stylesheet">
        {% block headd %} {% endblock %}
    </head>
    <body>
        <!-- Navbar-->
        <nav class ="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class = "container">
                <a class = "navbar-brand mb-0 h1" href = "{{ url_for('main.home') }}">Portfolio</a>

                <div>
                    <a href = "{{ url_for('main.home') }}" class ="btn btn-outline-light me-2">Home</a>
                    <a href = "{{ url_for('projects.project_page') }}" class = "btn btn-outline-light me-2">Projects</a>
                    
                </div>
            </div>
        </nav>
        <!-- Page content-->
         <div class = "container mt-4">
            {% block content %}{% endblock %}
         </div>

    </body>


</html>
